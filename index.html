<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Timbang">
<meta name="theme-color" content="#f3f6ff">
<title>Timbang</title>
<style>
:root{--bg:#f3f6ff;--card:#fff;--ink:#22294a;--mute:#6e7799;--line:#e2e8f8;--acc:#4a7dff;--accbg:#e6eeff;--pink:#ff6fa5;--warn:#c2306f;--warnbg:#ffe8f1;--bad:#c2306f;--badbg:#ffe0ec;--chip:#eef2fc}
@media (prefers-color-scheme:dark){:root{--bg:#121629;--card:#1c2140;--ink:#eef1ff;--mute:#a4abcc;--line:#2c3358;--acc:#7ea2ff;--accbg:#22305e;--pink:#ff8fbb;--warn:#ff9cc4;--warnbg:#3d1f33;--bad:#ff9cc4;--badbg:#45203a;--chip:#252b4f}}
.bar{height:12px;background:var(--chip);border-radius:999px;overflow:hidden;margin:8px 0 4px;position:relative}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--acc),var(--pink))}
.bar>b{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.35}
.barrow{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.em{font-size:22px;line-height:1}
nav button:not(.on) .em{filter:grayscale(1);opacity:.55}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 90px)}
h1{font-size:13px;font-weight:600;color:var(--mute);margin:0 0 2px;text-transform:none}
.big{font-size:34px;font-weight:700;margin:0;letter-spacing:-.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.lbl{font-size:12px;color:var(--mute);margin:0 0 4px}
.val{font-size:24px;font-weight:700;margin:0}
.sub{font-size:13px;color:var(--mute);margin:2px 0 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--mute);white-space:nowrap}
.pill.ok{background:var(--accbg);color:var(--acc)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}
.note{border-radius:12px;padding:10px 12px;font-size:14px;margin:12px 0}
.note.warn{background:var(--warnbg);color:var(--warn)}.note.bad{background:var(--badbg);color:var(--bad)}.note.ok{background:var(--accbg);color:var(--acc)}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 14px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--card);font-weight:600}
button.sm{padding:6px 12px;font-size:13px}
button.full{width:100%;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chips button{padding:8px 13px;border-radius:999px;font-size:14px;background:var(--chip);border-color:transparent}
.chips button.on{background:var(--accbg);color:var(--acc);border-color:var(--acc);font-weight:600}
input{font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input[type=number]{font-size:28px;font-weight:700;text-align:center}
.timer{font-size:56px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(env(safe-area-inset-bottom) + 8px)}
nav button{border:0;background:none;color:var(--mute);font-size:12px;padding:4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--acc);font-weight:600}
nav svg{width:22px;height:22px}
svg.chart{width:100%;height:auto;display:block}
.hidden{display:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .card{margin:0}
</style>
</head>
<body>
<main>
  <section id="v-home"></section>
  <section id="v-log" class="hidden"></section>
  <section id="v-crave" class="hidden"></section>
  <section id="v-hist" class="hidden"></section>
</main>
<nav>
  <button data-v="home" class="on"><span class="em">🏠</span>Home</button>
  <button data-v="log"><span class="em">⚖️</span>Log</button>
  <button data-v="crave"><span class="em">🔥</span>Craving</button>
  <button data-v="hist"><span class="em">📈</span>History</button>
</nav>
<script>
const CFG={start:'2026-10-19',startW:65,target:63,goalDate:'2026-12-03',beach:'2026-12-04',beachEnd:'2026-12-05',warnFrom:'2026-11-29',maintCeil:64,waitMin:30,minWeighins:4};
const FOODS=['Unli wings','Unli KBBQ','Samgyupsal','Other'];
const REASONS=['Date night','Ate breakfast','Stress','Payday','Friends','Other'];
const EM={'Unli wings':'🍗','Unli KBBQ':'🥩','Samgyupsal':'🥓','Date night':'💕','Ate breakfast':'🍳','Stress':'😩','Payday':'💸','Friends':'👯','Other':'🤷'};
const bar=(p,mk)=>`<div class="bar"><i style="width:${Math.round(Math.min(1,Math.max(0,p))*100)}%"></i>${mk!=null?`<b style="left:${mk*100}%"></b>`:''}</div>`;
const KEY='timbang-v1';
let S=load(),view='home',logDate=null,draft={},crave={food:null,reason:null};

function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.log)return s}catch(e){}return{log:{},tokens:[],cravings:[],timer:null,reward:{unlocked:null,used:null}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Could not save. Storage may be full or blocked.')}}

const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const f2=n=>(Math.round(n*100)/100).toFixed(2);
const nice=s=>parse(s).toLocaleDateString('en-US',{month:'short',day:'numeric'});
const $=id=>document.getElementById(id);

function avg7(end){let sum=0,n=0;for(let i=0;i<7;i++){const e=S.log[addDays(end,-i)];if(e&&e.w){sum+=e.w;n++}}return{avg:n?sum/n:null,n}}
function planAt(d){const t=Math.min(1,Math.max(0,diffDays(CFG.start,d)/diffDays(CFG.start,CFG.goalDate)));return CFG.startW+(CFG.target-CFG.startW)*t}
const inWarn=d=>d>=CFG.warnFrom&&d<=CFG.beachEnd;
const maint=d=>d>CFG.beachEnd;

function tokenState(d){
  const mk=d.slice(0,7),used=S.tokens.filter(t=>t.date.slice(0,7)===mk),has=t=>used.some(x=>x.type===t),day=+d.slice(8);
  return{
    monthsary:has('monthsary')?'used':(day<=7?'available':'expired'),
    flex:has('flex')?'used':'available',
    reward:S.reward.used?'used':(S.reward.unlocked?'available':'locked')
  };
}
function checkReward(){
  if(S.reward.unlocked)return;
  const a=avg7(today());
  if(a.n>=CFG.minWeighins&&Math.round(a.avg*100)/100<CFG.target){S.reward.unlocked=today();save()}
}
function spend(type,food,reason){
  const d=today();
  if(inWarn(d)&&!confirm('Beach window (Nov 29 to Dec 5). An unli meal can add 1 to 2 kg of water weight for a few days. Use it anyway?'))return false;
  S.tokens.push({date:d,type,food:food||'',reason:reason||''});
  if(type==='reward')S.reward.used=d;
  S.log[d]=Object.assign({},S.log[d],{meals:'unli'});
  save();return true;
}

function chart(){
  const pre=!maint(today()),end=pre?CFG.beachEnd:today(),start=pre?addDays(CFG.start,-7):addDays(end,-29),N=diffDays(start,end)+1,days=[];for(let i=0;i<N;i++)days.push(addDays(start,i));
  const pts=[],av=[];days.forEach((d,i)=>{const e=S.log[d];if(e&&e.w)pts.push([i,e.w]);const a=avg7(d);if(a.n)av.push([i,a.avg])});
  const vals=pts.concat(av).map(p=>p[1]).concat([CFG.target,planAt(start),planAt(end)]);
  const lo=Math.floor(Math.min(...vals)-.3),hi=Math.ceil(Math.max(...vals)+.3);
  const W=320,H=150,x=i=>10+i*(W-20)/(N-1),y=w=>10+(hi-w)/(hi-lo)*(H-34),ti=diffDays(start,today());
  const line=a=>a.map((p,k)=>(k?'L':'M')+x(p[0]).toFixed(1)+' '+y(p[1]).toFixed(1)).join(' ');
  let g='';for(let w=lo;w<=hi;w++)g+=`<line x1="10" x2="${W-10}" y1="${y(w)}" y2="${y(w)}" stroke="var(--line)"/><text x="${W-10}" y="${y(w)-3}" text-anchor="end" font-size="10" fill="var(--mute)">${w}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend, last 30 days">${g}
  <line x1="10" x2="${W-10}" y1="${y(CFG.target)}" y2="${y(CFG.target)}" stroke="var(--pink)" stroke-dasharray="2 4"/>
  <path d="M${x(0)} ${y(planAt(start))} L${x(diffDays(start,CFG.start))} ${y(planAt(CFG.start))} L${x(diffDays(start,CFG.goalDate))} ${y(CFG.target)} L${x(N-1)} ${y(planAt(end))}" stroke="var(--mute)" stroke-dasharray="5 4" fill="none"/>
  ${pre&&ti>=0&&ti<N?`<line x1="${x(ti)}" x2="${x(ti)}" y1="6" y2="${H-24}" stroke="var(--line)" stroke-width="2"/>`:''}
  ${pts.map(p=>`<circle cx="${x(p[0])}" cy="${y(p[1])}" r="2.8" fill="var(--pink)" opacity=".75"/>`).join('')}
  ${av.length>1?`<path d="${line(av)}" stroke="var(--acc)" stroke-width="2.5" fill="none"/>`:''}
  <text x="10" y="${H-6}" font-size="10" fill="var(--mute)">${nice(start)}</text><text x="${W-10}" y="${H-6}" font-size="10" fill="var(--mute)" text-anchor="end">${pre?'Beach':'Today'}</text></svg>
  <p class="sub">Line: 7-day average · Dots: daily · Dashed: plan · Dotted: 63.00</p>`;
}

function renderHome(){
  checkReward();
  const d=today(),a=avg7(d),ts=tokenState(d),e=S.log[d];
  let h='';
  if(!maint(d)){const left=diffDays(d,CFG.beach),tot=diffDays(CFG.start,CFG.beach);h+=`<h1>🏖️ Beach in</h1><p class="big">${left>0?left+' days':(left===0?'Today':'Now')}</p>${bar(1-left/tot)}<div class="barrow"><span>Oct 19</span><span>Dec 4 🌊</span></div>`}
  else h+=`<h1>🌸 Maintenance mode</h1><p class="big">Stay under ${f2(CFG.maintCeil)}</p>`;
  if(!e||!e.w)h+=`<div class="note warn">⚖️ Not weighed in today. <button class="sm" onclick="go('log')">Log now</button></div>`;
  if(e&&e.meals==='2')h+=`<div class="note warn">🍳 Breakfast logged. Keep dinner light.</div>`;
  if(maint(d)&&a.n&&a.avg>=CFG.maintCeil)h+=`<div class="note bad">⚠️ 7-day average is ${f2(a.avg)} kg, at or above ${f2(CFG.maintCeil)}. Skip the flex token this month.</div>`;
  if(!maint(d)){
    const togo=a.n?a.avg-CFG.target+0.01:null,pct=a.n?(CFG.startW-a.avg)/(CFG.startW-CFG.target+0.01):0;
    h+=`<div class="card"><p class="lbl">🍖 Road to Sumo Nikko</p>
    ${S.reward.unlocked?`<p class="val">Unlocked 🎉</p>${bar(1)}`:`<p class="val">${a.n?(togo>0?f2(togo)+' kg to go':'Almost 🎉'):'–'}</p>${bar(pct)}<div class="barrow"><span>${f2(CFG.startW)}</span><span>below ${f2(CFG.target)}</span></div>`}
    <p class="lbl" style="margin-top:12px">⚖️ Weigh-ins this week · ${a.n} of 7 (need ${CFG.minWeighins})</p>${bar(a.n/7,CFG.minWeighins/7)}</div>`;
  }
  h+=`<div class="card"><p class="lbl">📊 7-day average</p>`;
  if(a.n){
    const p=planAt(d),diff=a.avg-p;
    h+=`<p class="val">${f2(a.avg)} kg</p>`;
    if(!maint(d)){
      const wk=Math.max(diffDays(d,CFG.goalDate),1)/7,need=(a.avg-CFG.target)/wk;
      h+=`<p class="sub">${Math.abs(diff)<.05?'On plan':(diff>0?f2(diff)+' above plan':f2(-diff)+' below plan')} · ${need>0?'need '+f2(need)+' kg/week to reach 63.00':'below 63.00'}</p>`;
    }
  }else h+=`<p class="val">–</p><p class="sub">Log your weight to start.</p>`;
  h+=chart()+`</div>`;
  const pl={available:'<span class="pill ok">Available</span>',used:'<span class="pill">Used</span>',expired:'<span class="pill">Expired</span>',locked:'<span class="pill">Locked</span>'};
  h+=`<div class="card"><p class="lbl">🎟️ Unli tokens · ${parse(d).toLocaleDateString('en-US',{month:'long'})}</p>
  <div class="row"><div>💕 Monthsary<div class="sub">Days 1 to 7, no wait</div></div><div>${ts.monthsary==='available'?'<button class="sm pri" onclick="useDirect(\'monthsary\')">Use</button>':pl[ts.monthsary]}</div></div>
  <div class="row"><div>🎟️ Flex<div class="sub">Needs a ${CFG.waitMin}-min craving wait</div></div><div>${ts.flex==='available'?'<button class="sm" onclick="go(\'crave\')">Craving</button>':pl.used}</div></div>
  <div class="row"><div>🍖 Sumo Nikko<div class="sub">Bonus · 7-day avg below 63.00, ${CFG.minWeighins}+ weigh-ins</div></div><div>${ts.reward==='available'?'<button class="sm pri" onclick="useDirect(\'reward\')">Use</button>':pl[ts.reward]}</div></div></div>`;
  if(S.reward.unlocked&&!S.reward.used&&!maint(d)&&d<CFG.warnFrom)h+=`<div class="note ok">🎉 Sumo Nikko unlocked. Best before Nov 29 so the water weight clears before the beach.</div>`;
  $('v-home').innerHTML=h;
}
function useDirect(type){
  const name={monthsary:'monthsary',reward:'Sumo Nikko'}[type];
  if(!confirm('Use your '+name+' token today?'))return;
  if(spend(type,type==='reward'?'Sumo Nikko':'',type==='monthsary'?'Date night':'Reward'))render();
}

function renderLog(){
  if(!logDate)logDate=today();
  const e=S.log[logDate]||{};
  if(draft.date!==logDate)draft={date:logDate,w:e.w||'',meals:e.meals||null,size:e.size||null};
  const ch=(k,opts,labels)=>`<div class="chips">${opts.map((o,i)=>`<button class="${draft[k]===o?'on':''}" onclick="setD('${k}','${o}')">${labels[i]}</button>`).join('')}</div>`;
  $('v-log').innerHTML=`<h1>⚖️ Daily log</h1><p class="big">${logDate===today()?'Today':nice(logDate)}</p>
  <div class="card"><p class="lbl">📅 Date</p><input type="date" value="${logDate}" max="${today()}" onchange="logDate=this.value||today();renderLog()"></div>
  <div class="card"><p class="lbl">⚖️ Weight (kg)</p><input id="w" type="number" inputmode="decimal" step="0.01" placeholder="64.80" value="${draft.w}" oninput="draft.w=this.value">
  <p class="lbl" style="margin-top:14px">🍽️ Meals</p>${ch('meals',['1','2','unli'],['🍽️ 1 meal','🍳 2 meals','🔥 Unli'])}
  <p class="lbl">🥄 Main meal size</p>${ch('size',['light','normal','heavy'],['🥗 Light','🍛 Normal','🍖 Heavy'])}
  ${draft.meals==='2'?'<div class="note warn" style="margin:0 0 4px">🍳 Breakfast day. Keep dinner light.</div>':''}
  <button class="pri full" onclick="saveLog()">Save 💾</button></div>`;
}
function setD(k,v){draft.w=$('w').value;draft[k]=draft[k]===v?null:v;renderLog()}
function saveLog(){
  const w=parseFloat($('w').value);
  if($('w').value&&(isNaN(w)||w<30||w>200)){alert('Enter a weight in kg, like 64.80.');return}
  const e={};if(!isNaN(w))e.w=Math.round(w*100)/100;if(draft.meals)e.meals=draft.meals;if(draft.size)e.size=draft.size;
  if(Object.keys(e).length)S.log[logDate]=e;else delete S.log[logDate];
  save();draft={};logDate=null;go('home');
}

let tick=null;
function renderCrave(){
  const t=S.timer,ts=tokenState(today());
  let h=`<h1>🔥 Craving check</h1>`;
  if(!t){
    h+=`<p class="big">Wait ${CFG.waitMin} min ⏳</p><p class="sub">Pick what you want and why. Decide after the timer.</p>
    <div class="card"><p class="lbl">What do you want?</p><div class="chips">${FOODS.map(f=>`<button class="${crave.food===f?'on':''}" onclick="crave.food='${f}';renderCrave()">${EM[f]||'🍽️'} ${f}</button>`).join('')}</div>
    <p class="lbl">Why now?</p><div class="chips">${REASONS.map(r=>`<button class="${crave.reason===r?'on':''}" onclick="crave.reason='${r}';renderCrave()">${EM[r]} ${r}</button>`).join('')}</div>
    ${crave.reason==='Date night'&&ts.monthsary==='available'?'<div class="note ok" style="margin:0 0 8px">💕 If this is your monthsary, use the monthsary token on Home instead. No wait.</div>':''}
    ${crave.reason==='Ate breakfast'?'<div class="note warn" style="margin:0 0 8px">🍳 Hunger after breakfast usually passes. Have a light dinner.</div>':''}
    <p class="sub">🎟️ Flex token this month: ${ts.flex==='available'?'1 left':'used'}</p>
    <button class="pri full" onclick="startWait()">Start ${CFG.waitMin}-min wait ⏳</button></div>`;
  }else{
    const left=Math.max(0,t.start+CFG.waitMin*60000-Date.now()),done=left===0,m=Math.floor(left/60000),s=Math.floor(left/1000)%60;
    h+=`<p class="sub">${EM[t.food]||'🍽️'} ${t.food||'Craving'}${t.reason?' · '+(EM[t.reason]||'')+' '+t.reason:''}</p>
    <div class="card"><div class="timer">${pad(m)}:${pad(s)}</div>${bar(1-left/(CFG.waitMin*60000))}
    <p class="sub" style="text-align:center">${done?'⏰ Time is up. Decide now.':'Close the app if you want. The timer keeps running.'}</p>
    ${done?(ts.flex==='available'?'<button class="pri full" onclick="endCrave(true)">Use flex token</button>':'<div class="note bad">No flex token left this month.</div>'):''}
    <button class="full" onclick="endCrave(false)">${done?'Pass 💪':'Pass now 💪'}</button></div>`;
  }
  const c=S.cravings.filter(x=>x.date.slice(0,7)===today().slice(0,7));
  const np=c.filter(x=>x.outcome==='passed').length,nu=c.filter(x=>x.outcome==='used').length;
  h+=`<div class="card"><p class="lbl">📆 This month</p><div class="grid2"><div><p class="val">💪 ${np}</p><p class="sub">Passed</p></div><div><p class="val">🍗 ${nu}</p><p class="sub">Gave in</p></div></div>${np+nu?`${bar(np/(np+nu))}<div class="barrow"><span>Pass rate</span><span>${Math.round(np/(np+nu)*100)}%</span></div>`:''}</div>`;
  $('v-crave').innerHTML=h;
  clearInterval(tick);if(t&&view==='crave')tick=setInterval(()=>{if(view==='crave')renderCrave();else clearInterval(tick)},1000);
}
function startWait(){S.timer={start:Date.now(),food:crave.food,reason:crave.reason};crave={food:null,reason:null};save();renderCrave()}
function endCrave(use){
  const t=S.timer;
  if(use&&!spend('flex',t.food,t.reason))return;
  S.cravings.push({date:today(),food:t.food||'',reason:t.reason||'',outcome:use?'used':'passed'});
  S.timer=null;save();clearInterval(tick);renderCrave();
}

function renderHist(){
  const days=Object.keys(S.log).sort().reverse();
  const cnt={};S.cravings.forEach(c=>{if(c.reason)cnt[c.reason]=(cnt[c.reason]||0)+1});
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
  const tl={monthsary:'💕 Monthsary',flex:'🎟️ Flex',reward:'🍖 Sumo Nikko'},mx=top.length?top[0][1]:1;
  $('v-hist').innerHTML=`<h1>📈 History</h1><p class="big">${days.length} days logged</p>
  <div class="card"><p class="lbl">🧠 Craving reasons (all time)</p>${top.length?top.map(([r,n])=>`<div style="margin-top:8px"><div class="barrow" style="color:var(--ink);font-size:14px"><span>${EM[r]||''} ${r}</span><span>${n}</span></div>${bar(n/mx)}</div>`).join(''):'<p class="sub">No cravings logged yet.</p>'}</div>
  <div class="card"><p class="lbl">🎟️ Tokens used</p>${S.tokens.length?S.tokens.slice().reverse().map(t=>`<div class="row"><span>${nice(t.date)} · ${tl[t.type]}</span><span class="sub">${t.food||t.reason||''}</span></div>`).join(''):'<p class="sub">None yet.</p>'}</div>
  <div class="card"><p class="lbl">📋 Daily log</p>${days.length?days.map(d=>{const e=S.log[d];return`<div class="row" onclick="logDate='${d}';go('log')"><span>${nice(d)}</span><span>${e.w?f2(e.w)+' kg':'–'} <span class="pill ${e.meals==='unli'?'bad':(e.meals==='2'?'warn':'')}">${e.meals==='unli'?'Unli':(e.meals?e.meals+' meal'+(e.meals==='2'?'s':''):'–')}${e.size?' · '+e.size:''}</span></span></div>`}).join(''):'<p class="sub">Nothing logged yet.</p>'}</div>
  <div class="card"><p class="lbl">💾 Backup</p><p class="sub">Data lives on this phone only. Export now and then.</p>
  <div class="grid2" style="margin-top:8px"><button onclick="exportData()">Export</button><button onclick="$('imp').click()">Import</button></div>
  <input id="imp" type="file" accept="application/json" class="hidden" onchange="importData(this.files[0])"></div>`;
}
function exportData(){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='timbang-backup-'+today()+'.json';a.click()}
function importData(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!s.log)throw 0;if(confirm('Replace all current data with this backup?')){S=s;save();render()}}catch(e){alert('That file is not a Timbang backup.')}};r.readAsText(f)}

function go(v){view=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));['home','log','crave','hist'].forEach(k=>$('v-'+k).classList.toggle('hidden',k!==v));render();window.scrollTo(0,0)}
function render(){({home:renderHome,log:renderLog,crave:renderCrave,hist:renderHist})[view]()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
render();
</script>
</body>
</html>
